<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="t d"><title id="t">사실과 미공개 정보 구분</title><desc id="d">공식 공개 자료로 확인 가능한 정보와 공개되지 않아 단정할 수 없는 정보를 분리한 지도.</desc><defs><style>.h{font:800 22px sans-serif;fill:#10243d}.t{font:700 16px sans-serif;fill:#10243d}.s{font:14px sans-serif;fill:#60758a}</style></defs><rect width="1120" height="470" rx="22" fill="#eef5f8"/><rect x="40" y="45" width="500" height="380" rx="23" fill="#e9f8f3" stroke="#83d3bd" stroke-width="2"/><circle cx="82" cy="88" r="20" fill="#0b8166"/><path d="M71 88l8 8 15-18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text class="h" x="115" y="96">공개 확인됨</text><text class="t" x="78" y="148">• 세 모델 이름과 기능 역할</text><text class="t" x="78" y="188">• 양자화 CNN 기반 특징 추출</text><text class="t" x="78" y="228">• 기능별 지연시간과 메모리 수치</text><text class="t" x="78" y="268">• RGB + 8×8 ToF 입력</text><text class="t" x="78" y="308">• Neural-ART NPU 가속</text><text class="t" x="78" y="348">• 5.201M parameters / 약 602M MACC</text><text class="s" x="78" y="390">근거: ST 공식 case study 및 STM32N6 제품 페이지</text>
<rect x="580" y="45" width="500" height="380" rx="23" fill="#fff5df" stroke="#e8c172" stroke-width="2"/><circle cx="622" cy="88" r="20" fill="#b56a00"/><text x="622" y="96" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" fill="#fff">?</text><text class="h" x="655" y="96">공개되지 않음</text><text class="t" x="618" y="148">• 정확한 내부 layer graph</text><text class="t" x="618" y="188">• YOLO / ArcFace / MobileFaceNet 계열 여부</text><text class="t" x="618" y="228">• embedding dimension</text><text class="t" x="618" y="268">• exact distance metric와 threshold</text><text class="t" x="618" y="308">• 이 데모의 precise DCMIPP usage</text><text class="t" x="618" y="348">• 기능별 수치의 전체 합산 지연시간</text><text class="s" x="618" y="390">미공개 항목은 가능성 설명과 사실 단정을 분리해야 합니다.</text></svg>

