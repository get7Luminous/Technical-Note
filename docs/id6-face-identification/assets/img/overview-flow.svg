<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" role="img" aria-labelledby="t d">
<title id="t">STM32N6 MicroFace 전체 흐름</title><desc id="d">RGB와 ToF 센서 입력이 STM32N6의 MicroFace 처리 단계를 거쳐 식별 결과로 이어진다.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071b32"/><stop offset="1" stop-color="#0b466a"/></linearGradient><style>.box{fill:#102f4d;stroke:#4c7897;stroke-width:2}.txt{font:700 18px sans-serif;fill:#fff}.sub{font:14px sans-serif;fill:#bcd1e2}.flow{fill:none;stroke:#5cd6ff;stroke-width:4;stroke-linecap:round;stroke-dasharray:10 11;animation:f 1.8s linear infinite}.arrow{fill:#5cd6ff}@keyframes f{to{stroke-dashoffset:-42}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style></defs>
<rect width="1120" height="390" rx="24" fill="url(#bg)"/>
<text x="55" y="50" class="sub">SENSORS</text><text x="325" y="50" class="sub">ON-DEVICE AI</text><text x="935" y="50" class="sub">DECISION</text>
<rect class="box" x="50" y="80" width="190" height="95" rx="18"/><text class="txt" x="145" y="118" text-anchor="middle">IMX335</text><text class="sub" x="145" y="145" text-anchor="middle">RGB · 5.04 MP · HDR</text>
<rect class="box" x="50" y="215" width="190" height="95" rx="18"/><text class="txt" x="145" y="253" text-anchor="middle">VL53L5CX</text><text class="sub" x="145" y="280" text-anchor="middle">ToF · 8 × 8 zones</text>
<rect x="325" y="72" width="520" height="250" rx="24" fill="#0d2237" stroke="#36c8c4" stroke-width="2"/><text x="360" y="110" class="txt">STM32N6 · MicroFace SDK</text>
<rect class="box" x="350" y="145" width="132" height="116" rx="16"/><text class="txt" x="416" y="185" text-anchor="middle">검출</text><text class="sub" x="416" y="214" text-anchor="middle">FaceDetector4B</text><text class="sub" x="416" y="239" text-anchor="middle">8 ms</text>
<rect class="box" x="514" y="145" width="132" height="116" rx="16"/><text class="txt" x="580" y="185" text-anchor="middle">생체성</text><text class="sub" x="580" y="214" text-anchor="middle">FacePAD4A</text><text class="sub" x="580" y="239" text-anchor="middle">60 ms</text>
<rect class="box" x="678" y="145" width="132" height="116" rx="16"/><text class="txt" x="744" y="185" text-anchor="middle">특징</text><text class="sub" x="744" y="214" text-anchor="middle">FaceEncoder9B</text><text class="sub" x="744" y="239" text-anchor="middle">20 ms</text>
<rect class="box" x="920" y="130" width="150" height="145" rx="20"/><text class="txt" x="995" y="177" text-anchor="middle">1:N 매칭</text><text class="sub" x="995" y="208" text-anchor="middle">등록 / 미등록</text><text class="sub" x="995" y="232" text-anchor="middle">위변조 탐지</text>
<path class="flow" d="M240 127H300"/><path class="arrow" d="M300 121l13 6-13 6z"/><path class="flow" d="M240 263H286V235H300"/><path class="arrow" d="M300 229l13 6-13 6z"/><path class="flow" d="M482 203H498"/><path class="arrow" d="M498 197l13 6-13 6z"/><path class="flow" d="M646 203H662"/><path class="arrow" d="M662 197l13 6-13 6z"/><path class="flow" d="M845 203H902"/><path class="arrow" d="M902 197l13 6-13 6z"/>
</svg>

