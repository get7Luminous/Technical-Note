<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="t d"><title id="t">시스템 아키텍처</title><desc id="d">센서, STM32N6 내부 처리 자원, MicroFace 소프트웨어와 결과 인터페이스의 계층 구조.</desc>
