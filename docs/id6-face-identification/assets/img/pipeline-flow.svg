<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 390" role="img" aria-labelledby="t d"><title id="t">AI 파이프라인</title><desc id="d">캡처부터 얼굴 검출, 생체 판정, 특징 추출, 템플릿 비교, 최종 판정까지의 순서.</desc>
<defs><style>.b{fill:#102f4d;stroke:#477491;stroke-width:2}.t{font:700 17px sans-serif;fill:#fff}.s{font:13px sans-serif;fill:#bcd1e2}.num{font:800 15px sans-serif;fill:#06213d}.n{fill:#66dfd0}.p{fill:none;stroke:#69d8ff;stroke-width:4;stroke-dasharray:9 10;animation:f 1.4s linear infinite}.arrow{fill:#69d8ff}@keyframes f{to{stroke-dashoffset:-38}}@media(prefers-reduced-motion:reduce){.p{animation:none}}</style></defs><rect width="1160" height="390" rx="23" fill="#071b32"/>
