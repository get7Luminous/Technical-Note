<g transform="translate(218 96)"><rect class="b" width="150" height="175" rx="19"/><circle class="n" cx="28" cy="28" r="17"/><text class="num" x="28" y="34" text-anchor="middle">2</text><text class="t" x="79" y="77" text-anchor="middle">얼굴 검출</text><text class="s" x="79" y="107" text-anchor="middle">위치 · 영역</text><text class="s" x="79" y="132" text-anchor="middle">8 ms</text></g>
<g transform="translate(408 96)"><rect class="b" width="150" height="175" rx="19"/><circle class="n" cx="28" cy="28" r="17"/><text class="num" x="28" y="34" text-anchor="middle">3</text><text class="t" x="79" y="77" text-anchor="middle">PAD</text><text class="s" x="79" y="107" text-anchor="middle">실물 여부</text><text class="s" x="79" y="132" text-anchor="middle">60 ms</text></g>
<g transform="translate(598 96)"><rect class="b" width="150" height="175" rx="19"/><circle class="n" cx="28" cy="28" r="17"/><text class="num" x="28" y="34" text-anchor="middle">4</text><text class="t" x="79" y="77" text-anchor="middle">특징 추출</text><text class="s" x="79" y="107" text-anchor="middle">quantized CNN</text><text class="s" x="79" y="132" text-anchor="middle">20 ms</text></g>
