<g transform="translate(978 96)"><rect class="b" width="154" height="175" rx="19"/><circle class="n" cx="28" cy="28" r="17"/><text class="num" x="28" y="34" text-anchor="middle">6</text><text class="t" x="77" y="77" text-anchor="middle">판정</text><text class="s" x="77" y="107" text-anchor="middle">일치 / 미등록</text><text class="s" x="77" y="132" text-anchor="middle">위변조</text></g>
