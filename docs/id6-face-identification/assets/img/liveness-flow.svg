<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="t d"><title id="t">RGB와 ToF 기반 PAD</title><desc id="d">RGB 얼굴 정보와 8x8 거리 정보가 FacePAD4A에서 함께 분석되어 실물 또는 위변조로 판정된다.</desc><defs><style>.b{fill:#fff;stroke:#c3d1dc;stroke-width:2}.t{font:700 18px sans-serif;fill:#10243d}.s{font:14px sans-serif;fill:#60758a}.p{fill:none;stroke:#1478ff;stroke-width:4;stroke-dasharray:9 10;animation:f 1.5s linear infinite}.arrow{fill:#1478ff}@keyframes f{to{stroke-dashoffset:-38}}@media(prefers-reduced-motion:reduce){.p{animation:none}}</style></defs><rect width="1120" height="470" rx="22" fill="#eef5f8"/>
