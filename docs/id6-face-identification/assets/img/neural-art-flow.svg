<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" role="img" aria-labelledby="t d"><title id="t">Neural-ART 실행 분담</title><desc id="d">센서 입력, CPU 제어, NPU 신경망 추론, 메모리와 결과 출력의 데이터 흐름.</desc><defs><style>.b{fill:#102f4d;stroke:#4d7896;stroke-width:2}.t{font:700 18px sans-serif;fill:#fff}.s{font:14px sans-serif;fill:#bcd1e2}.p{fill:none;stroke:#5cd6ff;stroke-width:4;stroke-dasharray:10 10;animation:f 1.6s linear infinite}.arrow{fill:#5cd6ff}@keyframes f{to{stroke-dashoffset:-40}}@media(prefers-reduced-motion:reduce){.p{animation:none}}</style></defs><rect width="1120" height="460" rx="22" fill="#071b32"/>
