<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 450" role="img" aria-labelledby="t d"><title id="t">공개 성능 수치 비교</title><desc id="d">얼굴 검출 8밀리초, 특징 추출 20밀리초, 생체 검출 60밀리초, 천 명 매칭 4.5밀리초의 막대 비교.</desc><style>.t{font:700 17px sans-serif;fill:#10243d}.s{font:14px sans-serif;fill:#60758a}.v{font:800 18px sans-serif;fill:#10243d}.bar{transform-origin:left;animation:g 1s ease both}@keyframes g{from{transform:scaleX(0)}}@media(prefers-reduced-motion:reduce){.bar{animation:none}}</style><rect width="1120" height="450" rx="22" fill="#eef5f8"/><text class="s" x="55" y="55">단계별 ST 공개 측정값 · 길이는 60 ms 기준 상대 비교</text>
<text class="t" x="55" y="123">1000-user matching</text><rect x="280" y="98" width="720" height="32" rx="16" fill="#dfe9f0"/><rect class="bar" x="280" y="98" width="54" height="32" rx="16" fill="#00a6b8"/><text class="v" x="1025" y="122">4.5 ms</text>
<text class="t" x="55" y="203">Face detection</text><rect x="280" y="178" width="720" height="32" rx="16" fill="#dfe9f0"/><rect class="bar" x="280" y="178" width="96" height="32" rx="16" fill="#1478ff"/><text class="v" x="1025" y="202">8 ms</text>
<text class="t" x="55" y="283">Feature extraction</text><rect x="280" y="258" width="720" height="32" rx="16" fill="#dfe9f0"/><rect class="bar" x="280" y="258" width="240" height="32" rx="16" fill="#5b6ee1"/><text class="v" x="1025" y="282">20 ms</text>
<text class="t" x="55" y="363">Liveness / PAD</text><rect x="280" y="338" width="720" height="32" rx="16" fill="#dfe9f0"/><rect class="bar" x="280" y="338" width="720" height="32" rx="16" fill="#b56a00"/><text class="v" x="1025" y="362">60 ms</text>
<text class="s" x="55" y="414">각 수치는 기능별 시간입니다. 전체 체감 응답 시간은 실행 순서·동시성·입출력·UI 조건에 따라 달라집니다.</text></svg>

